[package]
name = "tacet-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cross-platform audiophile audio playback engine with native CoreAudio, ALSA, and WASAPI backends"

[dependencies]
rtrb = "0.4"
symphonia = { version = "0.6", features = ["all"] }
symphonia-opus = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio", "audio_unit", "audio_toolbox"] }
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27"
